name: catalog

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "composer install && exec apache2-foreground"
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: test
      DB_USER: test
      DB_PASS: test
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:9.7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      # без этого клиент mysql при импорте дампа считает его latin1
      LANG: C.UTF-8
    volumes:
      - ./mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
