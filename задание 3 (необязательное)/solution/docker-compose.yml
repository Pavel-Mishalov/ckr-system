name: requests

services:
  app:
    build: .
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_NAME: requests
      DB_USER: requests
      DB_PASS: requests
    command: sh -c "runuser -u www-data -- php yii migrate --interactive=0 && exec apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: requests
      MYSQL_USER: requests
      MYSQL_PASSWORD: requests
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
